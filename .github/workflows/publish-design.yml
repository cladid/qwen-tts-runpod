name: Build and publish Qwen VoiceDesign
on:
  workflow_dispatch:
  push:
    branches: [experiment/base-voice-clone]
    paths: [design/**, .github/workflows/publish-design.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: qwen-design-image-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python
        run: python -m py_compile design/handler.py
      - name: Worker contract tests
        run: |
          python -m pip install numpy==2.2.6 soundfile==0.13.1
          python -m unittest discover -s design -p test_handler.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./design
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/cladid/qwen-tts-runpod:0.4.0-voice-design
            ghcr.io/cladid/qwen-tts-runpod:design-sha-${{ github.sha }}
