name: Build and publish Qwen Base voice clone
on:
  workflow_dispatch:
  push:
    branches: [experiment/base-voice-clone]
    paths: [clone/**, .github/workflows/publish-base.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: qwen-base-image-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python
        run: python -m py_compile clone/handler.py
      - name: Worker contract tests
        run: |
          python -m pip install numpy==2.2.6 soundfile==0.13.1
          python -m unittest discover -s clone -p test_handler.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./clone
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/cladid/qwen-tts-runpod:0.3.0-base-prosody
            ghcr.io/cladid/qwen-tts-runpod:base-sha-${{ github.sha }}
